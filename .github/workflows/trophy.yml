name: Generate GitHub Trophies
on:
  schedule:
    - cron: "0 0 * * *" # Tự động cập nhật mỗi ngày
  workflow_dispatch: # Cho phép bạn tự bấm chạy thủ công

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Trophies SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          file: images/trophy.svg
          theme: radical
          
      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add images/trophy.svg
          git commit -m "Update Trophies" || exit 0
          git push
